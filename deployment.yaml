
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-ordering
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-ordering
  template:
    metadata:
      labels:
        app: food-ordering
    spec:
      containers:
        - name: food-ordering
          image: bbhavanasree/food-ordering:stable
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: food-ordering-active
spec:
  type: NodePort
  selector:
    app: food-ordering
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30022
